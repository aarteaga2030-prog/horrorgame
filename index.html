<style>
/* Layout: full-bleed found-footage view; camcorder OSD pinned to the four corners; menus are VHS tape labels; notes open as torn paper */
:root{
  --void:#050403; --osd:#ecebdf; --osd-dim:#a8a593; --rec:#e0322a; --mustard:#c9b45a; --paper:#e6dfc8; --paper-ink:#2c2a33; --panel:rgba(8,7,5,.86);
  --f-osd:'VT323','Courier New',monospace;
  --f-hand:'Caveat','Comic Sans MS',cursive;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--osd);overflow:hidden;font-family:var(--f-mono)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.osd{position:fixed;font-family:var(--f-osd);font-size:24px;line-height:1;color:var(--osd);text-shadow:0 0 6px rgba(255,255,240,.35),2px 2px 0 rgba(0,0,0,.6);pointer-events:none;letter-spacing:.04em;display:grid;gap:6px}
.tl{top:calc(18px + env(safe-area-inset-top,0px));left:calc(22px + env(safe-area-inset-left,0px))}
.tr{top:calc(18px + env(safe-area-inset-top,0px));right:calc(22px + env(safe-area-inset-right,0px));justify-items:end}
.bl{bottom:calc(18px + env(safe-area-inset-bottom,0px));left:calc(22px + env(safe-area-inset-left,0px))}
.br{bottom:calc(18px + env(safe-area-inset-bottom,0px));right:calc(22px + env(safe-area-inset-right,0px));justify-items:end}
.rec{display:flex;align-items:center;gap:8px}
.rec i{width:13px;height:13px;border-radius:50%;background:var(--rec);box-shadow:0 0 8px var(--rec);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.bar{width:110px;height:8px;border:2px solid var(--osd);box-sizing:border-box;padding:1px}
.bar i{display:block;height:100%;width:100%;background:var(--osd)}
.bar i.low{background:var(--rec)}
#battOsd.low{color:var(--rec);animation:blink 1s steps(2) infinite}
#tc{font-variant-numeric:tabular-nums}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:rgba(236,235,223,.4);pointer-events:none}
#captions{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 32px));display:grid;gap:4px;justify-items:center;pointer-events:none}
#captions div{font-family:var(--f-osd);font-size:22px;color:var(--osd);text-align:center;text-shadow:2px 2px 0 #000;background:rgba(0,0,0,.35);padding:1px 8px}
#prompt{position:fixed;left:50%;transform:translateX(-50%);top:calc(50% + 34px);font-family:var(--f-osd);font-size:22px;color:var(--osd);pointer-events:none;text-shadow:2px 2px 0 #000}
kbd{font-family:var(--f-osd);font-size:20px;border:2px solid currentColor;padding:0 5px;margin-right:6px}
#lookHint{position:fixed;left:50%;top:calc(50% - 50px);transform:translateX(-50%);font-family:var(--f-osd);font-size:20px;color:var(--osd-dim);pointer-events:none}
button:focus-visible{outline:2px solid var(--mustard);outline-offset:3px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,4,3,.9);z-index:20;padding:16px;box-sizing:border-box}
.tape{position:relative;width:min(560px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;background:#141310;border:1px solid #2c2a22;box-shadow:0 30px 80px rgba(0,0,0,.8);box-sizing:border-box}
.tape .label{min-height:0;overflow:auto;margin:18px 18px 14px;background:var(--paper);color:var(--paper-ink);padding:18px 20px 16px;background-image:repeating-linear-gradient(transparent 0 29px,rgba(60,90,160,.18) 29px 30px)}
.tape .label .top{display:flex;justify-content:space-between;font-family:var(--f-osd);font-size:18px;letter-spacing:.12em;color:#6b6655;border-bottom:3px solid #b8372d;padding-bottom:6px;margin-bottom:10px}
.tape h1{font-family:var(--f-osd);font-weight:400;font-size:clamp(64px,16vw,104px);line-height:.8;margin:6px 0 4px;letter-spacing:.04em;color:#1e1c22}
.tape h2{font-family:var(--f-osd);font-weight:400;font-size:44px;line-height:.9;margin:4px 0 10px;color:#1e1c22}
.tape .hand{font-family:var(--f-hand);font-size:26px;line-height:1.15;color:#2b3a7a;margin:0 0 10px}
.tape p{font-family:var(--f-mono);font-size:14px;line-height:1.6;margin:0 0 10px;max-width:60ch}
.tape .ctrl{font-family:var(--f-osd);font-size:19px;line-height:1.35;color:#3a372e;border-top:1px dashed #8a8470;padding-top:8px;margin-top:10px}
.tape .ctrl kbd{font-size:17px;border-width:1px;padding:0 4px;margin-right:4px}
.tape .actions{flex:none;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:0 18px 18px;flex-wrap:wrap}
.tape button{font-family:var(--f-osd);font-size:26px;letter-spacing:.1em;background:var(--osd);color:#111;border:0;padding:8px 22px;cursor:pointer}
.tape button:hover{background:#fff}
.tape button:disabled{opacity:.45;cursor:wait}
.tape .opts{display:flex;gap:10px;flex-wrap:wrap;padding:0 18px 12px}
.tape button.opt{font-size:20px;padding:5px 14px;background:#2a2a30;color:var(--osd);border:1px solid #55555e}
.tape button.opt[aria-pressed="true"]{background:#b8372d;color:#fff;border-color:#b8372d}
.tape .fine{font-family:var(--f-osd);font-size:17px;color:#8f8b78}
.lost{background:#0b0b0e}
.lost .label{background:#0b0b0e;color:var(--osd);background-image:none;border:2px solid #2c2c3a}
.lost h2{color:var(--osd)}
.lost .label .top{color:#8f8b78;border-color:#3a3a4a}
.lost p{color:#b9b6a6}
.note{width:min(440px,100%);background:var(--paper);color:#2a2a36;padding:26px 26px 20px;box-sizing:border-box;transform:rotate(-1.2deg);box-shadow:0 20px 60px rgba(0,0,0,.8);clip-path:polygon(0 2%,4% 0,12% 1.5%,25% 0,40% 1%,55% 0,70% 1.6%,85% 0,100% 1%,100% 100%,0 100%)}
.note .who{font-family:var(--f-osd);font-size:18px;color:#7a7466;margin-bottom:6px;letter-spacing:.1em}
.note .body{font-family:var(--f-hand);font-size:27px;line-height:1.2;margin:0 0 16px}
.note button{font-family:var(--f-osd);font-size:22px;background:#2a2a36;color:var(--paper);border:0;padding:6px 16px;cursor:pointer}
#mapWrap{position:fixed;left:calc(16px + env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));z-index:15;pointer-events:none;width:min(44vw,440px,calc(100vh - 230px))}
#mapWrap .panel{background:#e4dcc3;background-image:linear-gradient(rgba(70,110,170,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(70,110,170,.18) 1px,transparent 1px);background-size:14px 14px;color:#2b2a30;padding:10px 12px 8px;transform:rotate(-1.2deg);box-shadow:0 18px 50px rgba(0,0,0,.85);display:grid;gap:6px}
#mapWrap .mtitle{display:flex;justify-content:space-between;font-family:var(--f-hand);font-size:22px;line-height:1;color:#2b3a7a;border-bottom:2px solid #b8372d;padding-bottom:4px}
#mapWrap canvas{display:block;width:100%;height:auto;aspect-ratio:1/1}
#mapWrap .cap{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-hand);font-size:19px;line-height:1}
#mapWrap .k.you{color:#2b3a7a}#mapWrap .k.seen{color:#a8281d}#mapWrap .k.hint{color:#7a4a10}#mapWrap .k.note{color:#2b2a30}
#mapWrap .cap2{font-family:var(--f-osd);font-size:15px;color:#6b6655;letter-spacing:.06em}
@media (max-width:700px){#mapWrap{width:min(62vw,calc(100vh - 240px))}}
#touch .joy{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;border:2px solid rgba(236,235,223,.3);background:rgba(0,0,0,.25);touch-action:none}
#touch .knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(236,235,223,.28)}
#touch .btns{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,74px);gap:10px}
#touch .btns button{height:50px;font-family:var(--f-osd);font-size:20px;border:2px solid rgba(236,235,223,.5);background:rgba(0,0,0,.4);color:var(--osd);touch-action:none}
#endOsd{position:fixed;inset:0;pointer-events:none;z-index:12;font-family:var(--f-osd);color:var(--osd);text-shadow:0 0 6px rgba(255,255,240,.35),2px 2px 0 rgba(0,0,0,.6)}
#endOsd>div{position:absolute}
.eo-tl{top:calc(18px + env(safe-area-inset-top,0px));left:calc(22px + env(safe-area-inset-left,0px));font-size:30px}
.eo-tr{top:calc(18px + env(safe-area-inset-top,0px));right:calc(22px + env(safe-area-inset-right,0px));font-size:24px}
.eo-br{bottom:calc(18px + env(safe-area-inset-bottom,0px));right:calc(22px + env(safe-area-inset-right,0px));font-size:24px;font-variant-numeric:tabular-nums}
.eo-c{left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(34px,7vw,64px);letter-spacing:.12em;text-align:center;white-space:nowrap}
.eo-cap{left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:22px;background:rgba(0,0,0,.35);padding:1px 8px;white-space:nowrap}
.eo-cap:empty{display:none}
.eo-skip{bottom:calc(18px + env(safe-area-inset-bottom,0px));left:calc(22px + env(safe-area-inset-left,0px));font-size:18px;color:var(--osd-dim)}
@media (max-width:560px){.osd{font-size:19px}.bar{width:80px}.eo-cap{white-space:normal;width:calc(100% - 40px);text-align:center}}
@media (max-height:620px){.tape h1{font-size:58px}.tape p{font-size:13px;line-height:1.5}}
@media (prefers-reduced-motion:reduce){.rec i{animation:none}.note{transform:none}}
</style>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

const MODEL_URL='./smily_horror_monster.glb';
const ARMS_URL='./fps_arms.glb';
const CC_URL='./camcorder.glb';
const WORLD_URL='./world.glb';
const DEBUG=location.hash.includes('debug');
const $=id=>document.getElementById(id);
const V3=THREE.Vector3,Q=THREE.Quaternion;
const UP=new V3(0,1,0);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const damp=(c,t,r,dt)=>c+(t-c)*(1-Math.exp(-r*dt));
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG=mulberry((Math.random()*1e9)|0);
const rnd=()=>RNG(),pick=a=>a[Math.floor(rnd()*a.length)];

/* ============ LEVEL ============ */
const MON_H=2.35,MSC=MON_H/1.83;
const CS=2.6,GW=32,GH=32,WH=2.75,WT=0.16,DOORW=1.15,DOORH=2.12;
const EYE=1.62,CEYE=1.02;
let hE,vE,hD,vD,pillars=[],cellLight,panels=[],START={x:13,y:13};
const hI=(x,y)=>y*GW+x,vI=(x,y)=>y*(GW+1)+x;
const inCell=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH;
const D4=[[1,0],[-1,0],[0,1],[0,-1]];
function edgeOpen(x,y,dx,dy){const nx=x+dx,ny=y+dy;if(!inCell(nx,ny))return false;if(dx===1)return !(vE[vI(x+1,y)]||(vX&&vX[vI(x+1,y)]));if(dx===-1)return !(vE[vI(x,y)]||(vX&&vX[vI(x,y)]));if(dy===1)return !(hE[hI(x,y+1)]||(hX&&hX[hI(x,y+1)]));return !(hE[hI(x,y)]||(hX&&hX[hI(x,y)]))}
function setEdge(x,y,dx,dy,v){if(dx===1)vE[vI(x+1,y)]=v;else if(dx===-1)vE[vI(x,y)]=v;else if(dy===1)hE[hI(x,y+1)]=v;else hE[hI(x,y)]=v}
function vertexEdges(i,j){return[i<GW?hE[hI(i,j)]:0,i>0?hE[hI(i-1,j)]:0,j<GH?vE[vI(i,j)]:0,j>0?vE[vI(i,j-1)]:0]}// +x,-x,+z,-z
function cellBFS(tx,ty){const d=new Int16Array(GW*GH).fill(-1);if(!inCell(tx,ty))return d;const q=[tx+ty*GW];d[q[0]]=0;let h=0;
  while(h<q.length){const c=q[h++],x=c%GW,y=(c/GW)|0;for(const[dx,dy]of D4){if(!edgeOpen(x,y,dx,dy))continue;const n=c+dx+dy*GW;if(d[n]<0){d[n]=d[c]+1;q.push(n)}}}return d}
function generate(){
  hE=new Uint8Array((GH+1)*GW).fill(1);vE=new Uint8Array(GH*(GW+1)).fill(1);
  const vis=new Uint8Array(GW*GH),st=[[0,0]];vis[0]=1;
  while(st.length){const[x,y]=st[st.length-1];const o=D4.filter(([dx,dy])=>inCell(x+dx,y+dy)&&!vis[(y+dy)*GW+x+dx]);if(!o.length){st.pop();continue}const[dx,dy]=pick(o);setEdge(x,y,dx,dy,0);vis[(y+dy)*GW+x+dx]=1;st.push([x+dx,y+dy])}
  for(let y=1;y<GH;y++)for(let x=0;x<GW;x++)if(rnd()<.42)hE[hI(x,y)]=0;
  for(let y=0;y<GH;y++)for(let x=1;x<GW;x++)if(rnd()<.42)vE[vI(x,y)]=0;
  const clearRect=(x0,y0,w,h)=>{for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++){if(x>x0)vE[vI(x,y)]=0;if(y>y0)hE[hI(x,y)]=0}};
  for(let k=0;k<9;k++){const w=2+(rnd()*4|0),h=2+(rnd()*4|0);clearRect(rnd()*(GW-w)|0,rnd()*(GH-h)|0,w,h)}
  const pil=[];
  for(let k=0;k<5;k++){const w=5+(rnd()*4|0),h=5+(rnd()*4|0),x0=rnd()*(GW-w)|0,y0=rnd()*(GH-h)|0;clearRect(x0,y0,w,h);for(let y=y0+1;y<y0+h;y++)for(let x=x0+1;x<x0+w;x++)if((x+y)%2===0)pil.push([x,y])}
  for(let k=0;k<7;k++){const L=8+(rnd()*9|0);
    if(rnd()<.5){const y=1+(rnd()*(GH-3)|0),x0=rnd()*(GW-L)|0;for(let x=x0;x<x0+L;x++){hE[hI(x,y)]=rnd()<.16?0:1;hE[hI(x,y+1)]=rnd()<.16?0:1;if(x>x0)vE[vI(x,y)]=0}}
    else{const x=1+(rnd()*(GW-3)|0),y0=rnd()*(GH-L)|0;for(let y=y0;y<y0+L;y++){vE[vI(x,y)]=rnd()<.16?0:1;vE[vI(x+1,y)]=rnd()<.16?0:1;if(y>y0)hE[hI(x,y)]=0}}}
  hX=null;vX=null;XS=[];XB=[];XSH=null;XBH=null;PROPS=[];VOIDC=new Uint8Array(GW*GH);START={x:GW>>1,y:GH>>1};
  carveRegions();
  // doorways: a gap in an otherwise straight wall becomes a door-sized opening with a header above it
  hD=new Uint8Array((GH+1)*GW);vD=new Uint8Array(GH*(GW+1));
  for(let y=1;y<GH;y++)for(let x=1;x<GW-1;x++)if(!hE[hI(x,y)]&&hE[hI(x-1,y)]&&hE[hI(x+1,y)]&&rnd()<.78)hD[hI(x,y)]=1;
  for(let y=1;y<GH-1;y++)for(let x=1;x<GW;x++)if(!vE[vI(x,y)]&&vE[vI(x,y-1)]&&vE[vI(x,y+1)]&&rnd()<.78)vD[vI(x,y)]=1;
  const doorAt=(i,j)=>(i<GW&&hD[hI(i,j)])||(i>0&&hD[hI(i-1,j)])||(j<GH&&vD[vI(i,j)])||(j>0&&vD[vI(i,j-1)]);
  const inReg=(i,j)=>REGIONS.some(R=>i>=R.x0&&i<=R.x0+R.w&&j>=R.y0&&j<=R.y0+R.h);
  pillars=pil.filter(([i,j])=>!vertexEdges(i,j).some(Boolean)&&!doorAt(i,j)&&!inReg(i,j)).map(([i,j])=>({x:i*CS,z:j*CS}));
  regionColliders();computeNavX();regionDoors();
  for(let guard=0;guard<2000;guard++){const d=cellBFS(START.x,START.y);let fixed=false;
    for(let c=0;c<GW*GH&&!fixed;c++){if(d[c]>=0||REGC[c]>=0||VOIDC[c])continue;const x=c%GW,y=(c/GW)|0;for(const[dx,dy]of D4){if(inCell(x+dx,y+dy)&&d[c+dx+dy*GW]>=0){setEdge(x,y,dx,dy,0);fixed=true;break}}}
    if(!fixed)break}
  connectRegions();
  {const d=cellBFS(START.x,START.y);for(let c=0;c<GW*GH;c++)if(d[c]<0)VOIDC[c]=Math.max(VOIDC[c],1)}
  planProps();hashExtras();
  // lights: panels on a checkerboard, dead zones, flickerers
  panels=[];const zones=[];for(let k=0;k<5;k++)zones.push({x:rnd()*GW,y:rnd()*GH,r:2.2+rnd()*3});
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){if((x+y)%2)continue;let dead=zones.some(z=>Math.hypot(x+.5-z.x,y+.5-z.y)<z.r);if(Math.abs(x-START.x)<2&&Math.abs(y-START.y)<2)dead=false;
