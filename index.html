<style>

:root{

#game{touch-action:none}
#fx{pointer-events:none}

.tag{font-family:var(--f-type);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-ink);background:var(--paper);padding:4px 10px;transform:rotate(-1.2deg);box-shadow:0 2px 0 rgba(0,0,0,.5)}

#radio{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 32px));background:var(--panel);border:1px solid #4a3a22;border-left:4px solid var(--amber);padding:10px 14px;pointer-events:none;box-sizing:border-box}
#radio b{display:block;font-size:10px;letter-spacing:.2em;color:var(--amber);margin-bottom:3px}
#radio span{font-size:14px;line-height:1.45;color:var(--ink)}

#prompt{position:fixed;left:50%;transform:translateX(-50%);top:calc(50% + 34px);background:var(--panel);border:1px solid #3a342c;padding:8px 14px;text-align:center;pointer-events:none;min-width:200px}
#pName{font-family:var(--f-type);font-size:16px;color:var(--ink)}
#pState{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:2px 0 6px}
#pKeys{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--ink)}
#pKeys .off{opacity:.3}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid #6a5f50;border-bottom-width:2px;padding:0 5px;margin-right:4px;color:var(--amber)}
.prog{height:3px;background:#2a2520;margin-top:7px}
.prog i{display:block;height:100%;width:0;background:var(--amber)}
.prog i.brk{background:var(--rust)}
#lookHint{position:fixed;left:50%;top:calc(50% - 46px);transform:translateX(-50%);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);pointer-events:none}
#notesBtn{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(92px + env(safe-area-inset-top,0px));font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:var(--panel);color:var(--ink);border:1px solid #4a4036;padding:6px 10px;cursor:pointer}

[[5,8,2,2],[18,8,2,2],[32,8,2,2],[5,13,2,2],[16,13,2,2],[26,13,2,2],[34,13,2,2],[13,3,1,2]].forEach(d=>carve(d[0],d[1],d[2],d[3],-1));

  {wards:['clock','mirror','cellar'],faults:['breaker','furnace'],interval:24,wardWork:9,faultWork:4.5,

let AC=null,master,noiseBuf,loops={};

function castRay(ox,oy,ang,maxD){
  const dx=Math.cos(ang),dy=Math.sin(ang);let mx=Math.floor(ox),my=Math.floor(oy);
  const ddx=Math.abs(1/dx),ddy=Math.abs(1/dy);let sx,sy,sdx,sdy;
  if(dx<0){sx=-1;sdx=(ox-mx)*ddx}else{sx=1;sdx=(mx+1-ox)*ddx}
  if(dy<0){sy=-1;sdy=(oy-my)*ddy}else{sy=1;sdy=(my+1-oy)*ddy}
  let d=0;for(let i=0;i<80;i++){if(sdx<sdy){d=sdx;sdx+=ddx;mx+=sx}else{d=sdy;sdy+=ddy;my+=sy}if(d>maxD)return maxD;if(isWall(mx,my))return d}
  return maxD;
}
function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay);if(d<.01)return true;return castRay(ax,ay,Math.atan2(by-ay,bx-ax),d)>=d-.05}
function blocked(x,y,r){
  if(isWall(Math.floor(x-r),Math.floor(y-r))||isWall(Math.floor(x+r),Math.floor(y-r))||isWall(Math.floor(x-r),Math.floor(y+r))||isWall(Math.floor(x+r),Math.floor(y+r)))return true;
  for(const b of blockers){if(x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h)return true}
  return false;
}
function bfs(tx,ty){
  const dist=new Int16Array(W*H).fill(-1);if(isWall(tx,ty))return dist;
  const q=[tx+ty*W];dist[tx+ty*W]=0;let h=0;
  while(h<q.length){const c=q[h++],cx=c%W,cy=(c/W)|0;const nd=dist[c]+1;
    if(!isWall(cx+1,cy)&&dist[c+1]<0){dist[c+1]=nd;q.push(c+1)}
    if(!isWall(cx-1,cy)&&dist[c-1]<0){dist[c-1]=nd;q.push(c-1)}
    if(!isWall(cx,cy+1)&&dist[c+W]<0){dist[c+W]=nd;q.push(c+W)}
    if(!isWall(cx,cy-1)&&dist[c-W]<0){dist[c-W]=nd;q.push(c-W)}}
  return dist;
}
function moveAlong(e,field,gx,gy,sp,dt){
  const cx=Math.floor(e.x),cy=Math.floor(e.y);const cd=field?field[cy*W+cx]:-1;let tx=gx,ty=gy;
  if(field&&cd!==0){let best=cd<0?1e9:cd,bx=-1,by=-1;
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){if(!ox&&!oy)continue;const nx=cx+ox,ny=cy+oy;if(isWall(nx,ny))continue;if(ox&&oy&&(isWall(cx+ox,cy)||isWall(cx,cy+oy)))continue;const v=field[ny*W+nx];if(v>=0&&v<best){best=v;bx=nx;by=ny}}
    if(bx>=0){tx=bx+.5;ty=by+.5}}
  const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
  if(d>.02){const st=Math.min(d,sp*dt);e.x+=dx/d*st;e.y+=dy/d*st;const fa=Math.atan2(dy,dx);e.face+=angDiff(e.face,fa)*Math.min(1,dt*8);return true}
  return false;
}

  const holder=new THREE.Group();holder.add(root);monster.add(holder);
  root.updateMatrixWorld(true);
  const bb=new THREE.Box3().setFromObject(root,true);const size=new THREE.Vector3();bb.getSize(size);
  const s=size.y>0?2.3/size.y:1;holder.scale.setScalar(s);
  const c=new THREE.Vector3();bb.getCenter(c);holder.position.set(-c.x*s,-bb.min.y*s,-c.z*s);
  root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;const mats=Array.isArray(o.material)?o.material:[o.material];
    const nm=mats.map(m=>{const c=m.clone();c.transparent=true;c.userData.baseOpacity=1;return c});o.material=Array.isArray(o.material)?nm:nm[0];monsterMats.push(...nm)}});
  monsterLight=new THREE.PointLight(0x8a2018,0,4,2);monsterLight.position.set(0,2.1,.4);monster.add(monsterLight);
  scene.add(monster);monsterReady=true;
}
function proceduralMonster(){
  const root=new THREE.Group();const mat=M(0x080606,{roughness:.9});
  const torso=cyl(.18,.28,1.2,mat,10);torso.position.y=1.4;root.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.26,16,12),mat);head.position.y=2.15;root.add(head);
  const grin=new THREE.Mesh(new THREE.TorusGeometry(.13,.02,6,20,Math.PI),new THREE.MeshBasicMaterial({color:0xefe6cc}));grin.position.set(0,2.08,.22);grin.rotation.z=Math.PI;root.add(grin);
  for(let i=0;i<2;i++){const e=new THREE.Mesh(new THREE.SphereGeometry(.03,8,6),new THREE.MeshBasicMaterial({color:0xefe6cc}));e.position.set(i?.09:-.09,2.22,.22);root.add(e)}
  for(let i=0;i<4;i++){const l=cyl(.03,.03,1.1,mat,6);l.position.set((i<2?-1:1)*(i%2?.15:.3),i%2?.55:1.5,0);l.rotation.z=(i<2?1:-1)*(i%2?.05:.5);root.add(l);const tip=cyl(.005,.02,.25,MAT.metal,6);tip.position.set((i<2?-1:1)*(i%2?.15:.58),i%2?0:.95,0);root.add(tip)}
  setupMonster(root);
}
function loadMonster(done){
  const loader=new GLTFLoader();
  loader.load('./smily_horror_monster.glb',gltf=>{
    setupMonster(gltf.scene);monsterFromFile=true;
    if(gltf.animations&&gltf.animations.length){mixer=new THREE.AnimationMixer(gltf.scene);const a=mixer.clipAction(gltf.animations[0]);a.play()}
    done();
  },undefined,err=>{console.warn('Monster model failed to load, using fallback',err);proceduralMonster();done()});
}

function applyState(o,state,by){
  if(o.state===state)return;o.state=state;o.tkProg=0;
  const before=G.lastLevel,lv=level();G.lastLevel=lv;
  if(o.ward){
    if(state==='ok'){S.stinger();G.shake=.5;caption(o.cue);
      if(by==='player'){const fl=FIXED_LINE[G.night];radio(fl[0],fl[1]);setTimeout(()=>{if(G.state==='play')caption('[Something under the house laughs.]')},2200)}}
    else{S.crunch();if(by==='player')caption('[The house settles. Quieter.]')}
  }else{
    if(state==='broken'){caption(o.cue);if(o.k==='breaker'){noiseHit({ft:'lowpass',f:600,v:.5,d:.3});G.flash=.3}if(o.k==='frontdoor')S.wind();
      if(by==='tk'&&!G.once['hint_'+o.k]&&G.night<2){G.once['hint_'+o.k]=1;const h=FAULT_HINT[o.k];setTimeout(()=>{if(G.state==='play')radio(h[0],h[1])},1500)}}
    else S.chime();
  }
  const tier=tkTier();
  if(lv>before){
    if(tier===1&&!G.once.t1){G.once.t1=1;caption('[Heavy footsteps. It is walking the halls now.]')}
    if(tier===2&&!G.once.t2){G.once.t2=1;caption('[It is running.]')}
    if(tier===3){caption('[Every door in the house swings open.]');S.shriek(0)}
  }else if(lv<before&&lv===0)caption('[The footsteps stop.]');
}
function nearest(){
  let best=null,bd=1.6;
  for(const k in G.objs){const o=G.objs[k];if(!o.active)continue;const dx=o.x-player.x,dy=o.y-player.y,d=Math.hypot(dx,dy);
    if(d<bd&&(d<.7||Math.abs(angDiff(player.ang,Math.atan2(dy,dx)))<1.1)){bd=d;best={type:'obj',o}}}
  const n=NOTES[G.night];if(n){const d=Math.hypot(n.x-player.x,n.y-player.y);if(d<Math.min(bd+.1,1.6))best={type:'note',i:G.night}}
  return best;
}
let lastPrompt='';
function update(dt){
  const N=NIGHTS[G.night];
  if(!G.freeze)G.t+=dt;
  const sc=SCRIPTS[G.night];while(G.scriptI<sc.length&&G.t>=sc[G.scriptI][0]){radio(sc[G.scriptI][1],sc[G.scriptI][2]);G.scriptI++}
  if(G.night===2&&G.t>32&&!G.once.chalk){G.once.chalk=1;G.objs.breaker.chalk=true;G.objs.furnace.chalk=true;G.objs.phonograph.chalk=false;caption('[Somewhere, chalk scrapes on metal.]')}
  if(G.night===2&&!G.freezeDone&&!G.freeze&&G.t>=NIGHT_LEN-.6){G.freeze=true;G.freezeT=0;
    radio('YOU?',`It's stuck. Look at the time. Stuck at 5:59.`);radio('YOU?',`The sun can't come up while that clock is broken.`);radio('YOU?',`Fix it. Fix the clock. FIX IT.`)}
  if(G.freeze){G.freezeT+=dt;if(G.freezeT>24){G.freeze=false;G.freezeDone=true}}
  if(G.t>=NIGHT_LEN){if(G.night<2)showDawn();else showEnding(G.objs.clock.state==='ok');return}

  // look with arrow keys
  const turn=2.2*dt;if(keys.ArrowLeft)player.yaw+=turn;if(keys.ArrowRight)player.yaw-=turn;if(keys.ArrowUp)player.pitch=clamp(player.pitch+turn*.7,-1.3,1.3);if(keys.ArrowDown)player.pitch=clamp(player.pitch-turn*.7,-1.3,1.3);
  // forward in tile space
  const fx=-Math.sin(player.yaw),fy=-Math.cos(player.yaw);player.ang=Math.atan2(fy,fx);
  const rx=-fy,ry=fx;
  let f=0,s=0;if(keys.KeyW)f++;if(keys.KeyS)f--;if(keys.KeyD)s++;if(keys.KeyA)s--;f-=joy.y;s+=joy.x;
  let ix=fx*f+rx*s,iy=fy*f+ry*s;const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il}
  const soaked=G.objs.pipe.active&&G.objs.pipe.state==='broken';
  const sp=(keys.ShiftLeft||keys.ShiftRight?3.2:2.3)*(soaked?.78:1)*(G.act?.35:1);
  const nx=player.x+ix*sp*dt,ny=player.y+iy*sp*dt;
  if(!blocked(nx,player.y,.25))player.x=nx;if(!blocked(player.x,ny,.25))player.y=ny;
  if(il>.1){player.walk+=dt*sp*2.4;}

  const nr=nearest();const hE=keys.KeyE||touchFix,hQ=keys.KeyQ||touchBrk;let pk='';
  if(nr&&nr.type==='note'){if(ePress)readNote(nr.i);pk='note|'+nr.i;G.act=null}
  else if(nr){const o=nr.o;let kind=null;
    if(hE&&o.state!=='ok')kind='fix';else if(hQ&&o.state!=='broken')kind='break';
    if(kind){if(!G.act||G.act.o!==o||G.act.kind!==kind)G.act={o,kind,t:0};G.act.t+=dt;
      G.noiseT-=dt;if(G.noiseT<=0){G.noiseT=.16;S.ratchet(kind==='fix'?.18:.3);hearNoise()}
      if(G.act.t>=(kind==='fix'?2:1.2)){applyState(o,kind==='fix'?'ok':'broken','player');G.act=null}}
    else G.act=null;pk=`obj|${o.k}|${o.state}`}
  else G.act=null;
  ePress=false;updatePrompt(nr,pk);

  const powered=G.objs.breaker.state==='ok',burning=powered&&G.objs.furnace.state==='ok';
  const doorOpen=G.objs.frontdoor.active&&G.objs.frontdoor.state==='broken';
  let dw=burning?2.2:-1.25;if(doorOpen)dw-=.8;if(soaked)dw-=.3;if(burning&&!doorOpen&&!soaked)dw=2.2;else if(burning)dw=Math.min(dw,-.3);
  G.warm=clamp(G.warm+dw*dt,0,100);if(G.warm<=0){die('cold');return}
  const pp=G.objs.pipe;pp.puddle=clamp(pp.puddle+(pp.state==='broken'?dt*.04:-dt*.08),0,1);

  updateTinkerer(dt);if(G.state!=='play')return;
  particles(dt);updateRadio(dt);
  for(const c of G.caps)c.life-=dt;if(G.caps.length&&G.caps[0].life<=0){G.caps.shift();renderCaptions()}
  updateAmbience(dt,burning,doorOpen);updateHUD();
}
function hearNoise(){const tk=G.tk;if(tkTier()>=1&&tk.cool<=0&&Math.hypot(tk.x-player.x,tk.y-player.y)<12){tk.mode='hunt';tk.lostT=0}}
function farRoom(){let best=null,bd=-1;ROOMS.forEach(r=>{if(r.key==='hall')return;const cx=r.x+r.w/2,cy=r.y+r.h/2;const d=Math.hypot(cx-player.x,cy-player.y)+Math.random()*4;if(d>bd){bd=d;best={x:cx,y:cy}}});return best}
function inBeam(x,y){const dx=x-player.x,dy=y-player.y,d=Math.hypot(dx,dy);if(d>8.5||!G.flashOn)return false;
  if(Math.abs(angDiff(player.ang,Math.atan2(dy,dx)))>.5)return false;
  const va=Math.atan2(1.2-EYE,d*TS);if(Math.abs(va-player.pitch)>.6)return false;return los(player.x,player.y,x,y)}
function updateTinkerer(dt){
  const tk=G.tk,N=NIGHTS[G.night],tier=tkTier();const dP=Math.hypot(tk.x-player.x,tk.y-player.y);
  G.flickOff-=dt;if(tier>=1&&dP<6&&Math.random()<dt*2.5)G.flickOff=.05+Math.random()*.18;G.flashOn=G.flickOff<=0;
  tk.speed=0;
  if(tk.cool>0){tk.cool-=dt;tk.alpha=0;if(tk.cool<=0){const r=farRoom();tk.x=r.x;tk.y=r.y}return}
  const targetA=tier===0?.32:1;tk.alpha+=(targetA-tk.alpha)*Math.min(1,dt*2);
  if(G.freeze){if(!tk.clockField)tk.clockField=bfs(3,2);const m=moveAlong(tk,tk.clockField,3.4,2.6,2.2,dt);if(m)tk.speed=2.2;else tk.face+=angDiff(tk.face,Math.atan2(player.y-tk.y,player.x-tk.x))*Math.min(1,dt*4);
    if(dP<.55&&tier>=1)die('caught');return}
  const lit=inBeam(tk.x,tk.y);
  if(lit&&tier<=1){tk.beam+=dt;if(tk.beam>1){tk.beam=0;S.shriek(pan(tk.x,tk.y));caption('[It shrieks and folds itself into the dark.]');
      if(tk.job){G.objs[tk.job].tkProg=0;tk.job=null}tk.mode='job';tk.jobT=N.interval*.5;tk.cool=2.5;G.shake=.3;return}}
  else tk.beam=Math.max(0,tk.beam-dt*.5);
  const sees=dP<9&&los(tk.x,tk.y,player.x,player.y);
  if(tier>=2)tk.mode='hunt';
  else if(tier===1&&sees&&tk.mode!=='hunt'){tk.mode='hunt';tk.lostT=0}
  if(tk.mode==='hunt'&&tier<2){if(tier===0)tk.mode='job';else if(!sees){tk.lostT+=dt;if(tk.lostT>5)tk.mode='job'}else tk.lostT=0}
  let sp=[1.5,2.2,2.9,4.6][tier];if(lit&&tier===2)sp*=.4;
  let moving=false;
  if(tk.mode==='hunt'){tk.fieldT-=dt;if(tk.fieldT<=0||!tk.huntField){tk.huntField=bfs(Math.floor(player.x),Math.floor(player.y));tk.fieldT=.25}moving=moveAlong(tk,tk.huntField,player.x,player.y,sp,dt)}
  else if(tk.job){const o=G.objs[tk.job];const valid=o.ward?o.state==='broken':o.state==='ok';
    if(!valid){tk.job=null;tk.jobT=N.interval*.4}
    else{const d=Math.hypot(o.x-tk.x,o.y-tk.y);
      if(d>.85)moving=moveAlong(tk,tk.field,o.x,o.y,sp,dt);
      else{tk.face+=angDiff(tk.face,Math.atan2(o.y-tk.y,o.x-tk.x))*Math.min(1,dt*5);tk.speed=.35;
        if(!tk.announced){tk.announced=true;caption(`[Faint tinkering, somewhere in the ${ROOMS[roomAt(o.x,o.y)].name}.]`)}
        o.tkProg+=dt/(o.ward?N.wardWork:N.faultWork);
        tk.workSnd-=dt;if(tk.workSnd<=0){tk.workSnd=.2+Math.random()*.35;const v=fall(o.x,o.y,16);if(v>0){S.tick(pan(o.x,o.y),v*.5);if(Math.random()<.3)noiseHit({f:1500+Math.random()*2000,q:8,v:v*.2,d:.08,pan:pan(o.x,o.y)})}}
        if(Math.random()<dt*10)spawn('spark',wx(o.x)+(Math.random()-.5)*.4,.8+Math.random()*.8,wz(o.y)+(Math.random()-.5)*.4,(Math.random()-.5)*2,Math.random()*1.5,(Math.random()-.5)*2,.4);
        if(o.tkProg>=1){applyState(o,o.ward?'ok':'broken','tk');tk.job=null;tk.jobT=N.interval*(.75+Math.random()*.5)}}}}
  else{tk.jobT-=dt;if(tk.jobT<=0)pickJob();
    tk.wanderT-=dt;if(tk.wanderT<=0||!tk.wander){const r=ROOMS[Math.floor(Math.random()*ROOMS.length)];tk.wander={x:r.x+1+Math.random()*(r.w-2),y:r.y+1+Math.random()*(r.h-2)};tk.wanderField=bfs(Math.floor(tk.wander.x),Math.floor(tk.wander.y));tk.wanderT=8+Math.random()*6}
    moving=moveAlong(tk,tk.wanderField,tk.wander.x,tk.wander.y,sp*.6,dt);if(moving)sp*=.6}
  if(moving){tk.speed=sp;tk.stepT-=dt*(sp/2);if(tk.stepT<=0){tk.stepT=.5;const v=fall(tk.x,tk.y,22)*(tier===0?.18:.7);if(v>.01)S.thump(pan(tk.x,tk.y),v)}}
  if(tier>=1&&dP<7){tk.heartT-=dt;if(tk.heartT<=0){tk.heartT=Math.max(.35,dP*.12);S.heart(.35*(1-dP/7)+.05)}}
  if(dP<.55){
    if(tier===0){G.warm=Math.max(0,G.warm-25);caption('[Something cold brushes past you.]');S.shriek(pan(tk.x,tk.y));G.flash=.4;if(tk.job){G.objs[tk.job].tkProg=0;tk.job=null}tk.cool=2.5;tk.jobT=N.interval*.5}
    else die('caught');
  }
}
function pickJob(){
  const N=NIGHTS[G.night],tk=G.tk;let k=null;
  if(tk.firstJob){k=tk.firstJob;tk.firstJob=null}
  else{const wc=N.wards.filter(k=>G.objs[k].state==='broken'),fc=N.faults.filter(k=>G.objs[k].state==='ok');
    const pool=(Math.random()<.55&&wc.length)?wc:(fc.length?fc:wc);if(!pool.length){tk.jobT=3;return}k=pool[Math.floor(Math.random()*pool.length)]}
  tk.job=k;const o=G.objs[k];tk.field=bfs(Math.floor(o.x),Math.floor(o.y));tk.announced=false;tk.mode='job';
}
function particles(dt){
  const o=G.objs;
  if(o.breaker.state==='broken'&&Math.random()<dt*8)spawn('spark',wx(o.breaker.x),1.45,wz(15)+.15,(Math.random()-.5)*2,Math.random()*1.5,Math.random()*1.5,.5);
  if(o.frontdoor.active&&o.frontdoor.state==='broken')for(let i=0;i<3;i++)if(Math.random()<dt*30)spawn('snow',8+Math.random()*2,Math.random()*2.2,wz(24.6),(Math.random()-.5)*.8,-.2-Math.random()*.3,-2-Math.random()*2.5,2.2);
  if(o.pipe.active&&o.pipe.state==='broken')for(let i=0;i<3;i++)if(Math.random()<dt*50)spawn('water',wx(o.pipe.x),1.2,wz(1)+.2,(Math.random()-.5)*1.4,-.5+Math.random(),.6+Math.random()*1.4,.7);
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;if(p.type!=='snow')p.vy-=9*dt;else p.vx+=(Math.random()-.5)*dt*4;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<.01){p.y=.01;p.vy*=-.2;p.vx*=.5;p.vz*=.5}if(p.life<=0)G.parts.splice(i,1)}
}
let clockT=0,mbT=0,mbI=0,phT=0;
const MB=[659,587,523,494,523,587,440,0,659,698,659,587,523,0,494,440];
function updateAmbience(dt,burning,doorOpen){
  if(!AC)return;const o=G.objs;
  setLoop('drone',.05+level()/wardCount()*.3);
  setLoop('wind',doorOpen?.35*Math.max(.25,fall(6,23.5,30)):0);
  setLoop('hum',burning?.14*fall(o.furnace.x,o.furnace.y,16):0);
  setLoop('hiss',(o.pipe.active&&o.pipe.state==='broken')?.14*Math.max(.15,fall(o.pipe.x,o.pipe.y,20)):0);
  clockT-=dt;if(clockT<=0){clockT=1;if(o.clock.state==='ok'||G.freeze)S.tick(pan(o.clock.x,o.clock.y),Math.max(.2,fall(o.clock.x,o.clock.y,30))*(G.freeze?.9:.7))}
  if(o.musicbox.active&&o.musicbox.state==='ok'){mbT-=dt;if(mbT<=0){mbT=.34;const f=MB[mbI++%MB.length];if(f)S.note(f+Math.sin(G.time)*4,pan(o.musicbox.x,o.musicbox.y),.12*Math.max(.15,fall(o.musicbox.x,o.musicbox.y,24)))}}
  if(o.phonograph.active&&o.phonograph.state==='ok'){phT-=dt;if(phT<=0){phT=.62;const f=[196,185,175,165][Math.floor(G.time*1.6)%4];S.note(f+Math.sin(G.time*3)*6,pan(o.phonograph.x,o.phonograph.y),.1*Math.max(.15,fall(o.phonograph.x,o.phonograph.y,24)),'sawtooth')}}
}
function updateRadio(dt){
  if(G.radioCur){G.radioCur.life-=dt;if(G.radioCur.life<=0){G.radioCur=null;$('radio').hidden=true}}
  if(!G.radioCur&&G.radioQ.length){const r=G.radioQ.shift();r.life=Math.max(4.5,r.txt.length*.065);G.radioCur=r;S.staticB(.35);
    $('radioWho').textContent='CH 7 · '+r.who;$('radioTxt').textContent=r.txt;const el=$('radio');el.className=r.who==='YOU?'?'you':'';el.hidden=false}
}
const hudCache={};
function setText(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v}}
function updateHUD(){
  const h=Math.floor(G.t/HOUR),m=Math.floor((G.t%HOUR)/HOUR*60);
  setText('clock',G.freeze?'5:59 AM':`${h===0?12:h}:${String(m).padStart(2,'0')} AM`);$('clock').classList.toggle('frozen',G.freeze);
  const ri=roomAt(player.x,player.y);setText('roomName',ri>=0?ROOMS[ri].name:'Doorway');
  const w=Math.round(G.warm)+'%';if(hudCache.warm!==w){hudCache.warm=w;$('warmBar').style.width=w}
  $('lookHint').hidden=!(lastPtr==='mouse'&&!locked&&!G.paused);
}
function updatePrompt(nr,key){
  const p=$('prompt');
  if(!nr){if(lastPrompt){p.hidden=true;lastPrompt=''}return}
  if(key!==lastPrompt){lastPrompt=key;p.hidden=false;
    if(nr.type==='note'){$('pName').textContent=NOTES[nr.i].title;$('pState').textContent=G.collected[nr.i]?'Already in your notebook':'A torn notebook page';$('pKeys').innerHTML='<span><kbd>E</kbd>Read</span>'}
    else{const o=nr.o;$('pName').textContent=o.name;$('pState').textContent=o.state==='ok'?o.ok:o.br;
      $('pKeys').innerHTML=`<span class="${o.state==='ok'?'off':''}"><kbd>E</kbd>hold · Fix</span><span class="${o.state==='broken'?'off':''}"><kbd>Q</kbd>hold · Break</span>`}}
  const bar=$('pBar');
  if(G.act){bar.style.width=Math.min(100,G.act.t/(G.act.kind==='fix'?2:1.2)*100)+'%';bar.className=G.act.kind==='break'?'brk':''}else bar.style.width='0';
}

/* ================= RENDER ================= */
const grainCv=document.createElement('canvas');grainCv.width=grainCv.height=160;
(function(){const g=grainCv.getContext('2d'),id=g.createImageData(160,160);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0)})();
let grainPat=null;
const tmpV=new THREE.Vector3();
function syncWorld(dt){
  const tm=G.time,o=G.objs;
  for(const k in OBJ3D){const ob=o[k],v=OBJ3D[k];const vis=ob.active||k==='frontdoor'||k==='breaker'||k==='furnace'||k==='clock'||k==='mirror'||k==='cellar';
    v.g.visible=vis;if(vis)v.update(ob,tm,dt);v.chalk.visible=ob.active&&ob.chalk}
  // musicbox / phonograph only exist on their nights; hide when inactive
  OBJ3D.musicbox.g.visible=o.musicbox.active;OBJ3D.phonograph.g.visible=o.phonograph.active;OBJ3D.pipe.g.visible=true;
  NOTES.forEach((n,i)=>{n.mesh.visible=G.state==='title'?false:i===G.night;n.mesh.material.emissiveIntensity=G.collected[i]?0:.25+.25*Math.sin(tm*4)});
  // lamps
  const powered=o.breaker.state==='ok';const tk=G.tk;const tier=tk?tkTier():0;
  for(const l of lamps){let on=powered;let fl=1;
    if(on&&tk&&tier>=1){const d=Math.hypot(tk.x-(l.L.position.x/TS),tk.y-(l.L.position.z/TS));if(d<5&&Math.random()<.25)fl=Math.random()*.4}
    l.L.intensity=on?l.base*fl*(G.state==='title'?1.2:1):0;l.bulb.material.color.setHex(on&&fl>.5?0xffd9a0:0x1a1510)}
  // particles
  const n=G.parts.length;for(let i=0;i<n;i++){const p=G.parts[i],c=PCOL[p.type],a=Math.min(1,p.life/p.max*1.5);pPos[i*3]=p.x;pPos[i*3+1]=p.y;pPos[i*3+2]=p.z;pCol[i*3]=c[0]*a;pCol[i*3+1]=c[1]*a;pCol[i*3+2]=c[2]*a}
  pGeo.setDrawRange(0,n);pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true;
  // monster
  if(monster&&tk){
    const show=G.state!=='title'&&tk.alpha>.02;monster.visible=show||G.state==='dying';
    if(G.state!=='dying'){monster.position.set(wx(tk.x),0,wz(tk.y));monster.rotation.y=Math.atan2(Math.cos(tk.face),Math.sin(tk.face));monster.scale.setScalar(1);
      const a=tier===0?tk.alpha*(.65+.35*Math.sin(tm*13)):tk.alpha;setMonsterOpacity(a);monsterLight.intensity=tier>=1?.7:0}
    if(mixer)mixer.timeScale=G.state==='dying'?2.5:clamp(.35+tk.speed*.45,.3,2.6);
  }
  if(mixer)mixer.update(dt);
}
function placeCamera(dt){
  if(G.state==='title'||G.state==='loading'){G.camDrift+=dt*.04;const x=wx(20+Math.sin(G.camDrift)*14),z=wz(11.5);camera.position.set(x,EYE,z);camera.rotation.set(-.05,Math.PI/2+Math.sin(G.camDrift*1.3)*.9,0);flash.visible=false;bodyGlow.visible=false;return}
  flash.visible=G.flashOn;bodyGlow.visible=true;
  const bob=Math.sin(player.walk*2)*.035;
  G.shake=Math.max(0,G.shake-dt);const sh=G.shake*.06;
  camera.position.set(wx(player.x)+(Math.random()-.5)*sh,EYE+bob+(Math.random()-.5)*sh,wz(player.y)+(Math.random()-.5)*sh);
  camera.rotation.set(player.pitch,player.yaw,0);
}
function renderFX(dt){
  const w=fxCv.width,h=fxCv.height;fx.clearRect(0,0,w,h);
  if(G.state==='dying'&&G.deathReason==='cold'){fx.fillStyle=`rgba(180,205,225,${Math.min(1,G.scareT)})`;fx.fillRect(0,0,w,h);return}
  const playing=G.state==='play'||G.state==='dying';
  if(playing&&G.warm<45){const a=(45-G.warm)/45;const g=fx.createRadialGradient(w/2,h/2,Math.min(w,h)*.25,w/2,h/2,Math.hypot(w,h)*.55);g.addColorStop(0,'rgba(120,160,200,0)');g.addColorStop(1,`rgba(150,190,225,${a*.5})`);fx.fillStyle=g;fx.fillRect(0,0,w,h)}
  fx.fillStyle=vign;fx.fillRect(0,0,w,h);
  if(G.flash>0){G.flash-=dt;fx.fillStyle=`rgba(255,255,255,${Math.max(0,G.flash)*.5})`;fx.fillRect(0,0,w,h)}
  let danger=0;const tk=G.tk;if(tk&&G.state==='play'&&tkTier()>=1){danger=clamp(1-Math.hypot(tk.x-player.x,tk.y-player.y)/7,0,1)}
  if(G.state==='dying')danger=1;
  if(!grainPat)grainPat=fx.createPattern(grainCv,'repeat');
  fx.save();fx.globalAlpha=.07+danger*.2;fx.translate(Math.random()*160,Math.random()*160);fx.fillStyle=grainPat;fx.fillRect(-160,-160,w+320,h+320);fx.restore();
  if(danger>0){fx.fillStyle=`rgba(120,10,0,${danger*(G.state==='dying'?.3:.12)})`;fx.fillRect(0,0,w,h)}
  if(danger>.3&&Math.random()<danger*.2){fx.fillStyle='rgba(255,255,255,.06)';fx.fillRect(0,Math.random()*h,w,4+Math.random()*30*danger)}
}
function scareStep(dt){
  // the monster lunges into the camera
  if(G.deathReason==='cold'||!monster)return;
  const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);fwd.y=0;fwd.normalize();
  const d=Math.max(.55,1.6-G.scareT*1.6);
  monster.position.set(camera.position.x+fwd.x*d,EYE-2.05,camera.position.z+fwd.z*d);
  monster.rotation.y=Math.atan2(-fwd.x,-fwd.z);monster.scale.setScalar(1.05);setMonsterOpacity(1);monsterLight.intensity=3;
  G.shake=.8;
}

/* ================= LOOP ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;G.time+=dt;
  try{
    if(G.state==='play'&&!G.paused)update(dt);
    placeCamera(dt);
    if(G.state==='dying'){G.scareT+=dt;scareStep(dt);if(G.scareT>1.6)showDeath()}
    syncWorld(dt);
    renderer.render(scene,camera);renderFX(dt);
  }catch(err){console.error(err)}
  requestAnimationFrame(loop);
}
buildHouse();buildLamps();buildObjects();
setupNight(0);G.state='title';showTitle();requestAnimationFrame(loop);
loadMonster(()=>{const b=$('goTitle');if(b){b.disabled=false;b.textContent='Enter the house';b.focus({preventScroll:true})}});
</script>
