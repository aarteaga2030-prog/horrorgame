<style>

#photoCount{font-family:var(--f-serif);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}

[[7,7,2,1],[18,7,2,1],[27,7,2,1],[10,10,2,1],[7,15,2,1],[15,10,2,1],[18,15,2,1],[25,15,2,1],[22,12,1,2],[5,18,2,1],[16,18,2,1],[26,18,2,1]].forEach(d=>carve(d[0],d[1],d[2],d[3],-1));

  const far=G.finalTaken?{x:6,y:9}:[{x:27,y:21.5},{x:8,y:3.5},{x:28,y:4},{x:5,y:21}][Math.floor(Math.random()*4)];mon.x=far.x;mon.y=far.y;mon.unseen=0;mon.field=null;G.caps=[];renderCaptions()}

/* ================= AUDIO ================= */
let AC=null,master,noiseBuf,loops={};
function initAudio(){

  giggle:(p,v)=>{const base=520+Math.random()*120;for(let i=0;i<5;i++){blip({f:base*(1-i*.06),f2:base*(1-i*.06)*.8,type:'sawtooth',v:v*.35,d:.09,a:.01,bp:1300,q:4,pan:p,delay:i*.13});noiseHit({f:3200,q:3,v:v*.06,d:.05,pan:p,delay:i*.13})}},

/* ================= GRID HELPERS ================= */
function castRay(ox,oy,ang,maxD){
  const dx=Math.cos(ang),dy=Math.sin(ang);let mx=Math.floor(ox),my=Math.floor(oy);
  const ddx=Math.abs(1/dx),ddy=Math.abs(1/dy);let sx,sy,sdx,sdy;
  if(dx<0){sx=-1;sdx=(ox-mx)*ddx}else{sx=1;sdx=(mx+1-ox)*ddx}
  if(dy<0){sy=-1;sdy=(oy-my)*ddy}else{sy=1;sdy=(my+1-oy)*ddy}
  let d=0;for(let i=0;i<80;i++){if(sdx<sdy){d=sdx;sdx+=ddx;mx+=sx}else{d=sdy;sdy+=ddy;my+=sy}if(d>maxD)return maxD;if(isWall(mx,my))return d}

function los(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay);if(d<.01)return true;return castRay(ax,ay,Math.atan2(by-ay,bx-ax),d)>=d-.05}

  return false;

function bfs(tx,ty){
  const dist=new Int16Array(W*H).fill(-1);if(isWall(tx,ty))return dist;

  while(h<q.length){const c=q[h++],cx=c%W,cy=(c/W)|0,nd=dist[c]+1;
    if(!isWall(cx+1,cy)&&dist[c+1]<0){dist[c+1]=nd;q.push(c+1)}

function lit(x,y,hgt){
  if(!G.flashOn)return false;const dx=x-player.x,dy=y-player.y,d=Math.hypot(dx,dy);if(d>9.5)return false;
  if(d>.6&&Math.abs(angDiff(player.ang,Math.atan2(dy,dx)))>.4)return false;
  const va=Math.atan2((hgt==null?mHeight*.55:hgt)-EYE,Math.max(.3,d*TS));if(Math.abs(va-player.pitch)>.5)return false;
  return los(player.x,player.y,x,y);
}
function inView(x,y){const dx=x-player.x,dy=y-player.y;return Math.abs(angDiff(player.ang,Math.atan2(dy,dx)))<.75&&los(player.x,player.y,x,y)}
function relocateBehind(){
  const f=bfs(Math.floor(player.x),Math.floor(player.y));
  for(let t=0;t<60;t++){const a=player.ang+Math.PI+(Math.random()-.5)*1.2,d=3+Math.random()*3;const x=player.x+Math.cos(a)*d,y=player.y+Math.sin(a)*d;
    if(isWall(Math.floor(x),Math.floor(y))||blocked(x,y,.25))continue;
    const v=f[Math.floor(y)*W+Math.floor(x)];if(v<0||v>8)continue;
    mon.x=x;mon.y=y;mon.unseen=0;mon.field=null;S.giggle(pan(x,y),.9);caption(LINES.behind);return true}
  return false;
}
function update(dt){
  const turn=2.2*dt;if(keys.ArrowLeft)player.yaw+=turn;if(keys.ArrowRight)player.yaw-=turn;if(keys.ArrowUp)player.pitch=clamp(player.pitch+turn*.7,-1.3,1.3);if(keys.ArrowDown)player.pitch=clamp(player.pitch-turn*.7,-1.3,1.3);
  const fwx=-Math.sin(player.yaw),fwy=-Math.cos(player.yaw);player.ang=Math.atan2(fwy,fwx);
  G.cranking=!!(keys.KeyR||touchCrank);
  if(G.cranking){G.bat=Math.min(100,G.bat+15*dt);G.crankT=(G.crankT||0)-dt;if(G.crankT<=0){G.crankT=.09;S.crank()}}
  let f=0,s=0;if(keys.KeyW)f++;if(keys.KeyS)f--;if(keys.KeyD)s++;if(keys.KeyA)s--;f-=joy.y;s+=joy.x;
  let ix=fwx*f+(-fwy)*s,iy=fwy*f+fwx*s;const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il}
  const wantRun=(keys.ShiftLeft||keys.ShiftRight||touchRun)&&il>.1&&G.stam>0;
  if(wantRun)G.stam=Math.max(0,G.stam-22*dt);else G.stam=Math.min(100,G.stam+12*dt);
  if(G.stam<=0&&!G.once.breath){G.once.breath=1;S.breath()}if(G.stam>30)G.once.breath=0;
  const sp=(wantRun?3.3:2.0)*(G.cranking?.45:1);
  const nx=player.x+ix*sp*dt,ny=player.y+iy*sp*dt;
  if(!blocked(nx,player.y,.24))player.x=nx;if(!blocked(player.x,ny,.24))player.y=ny;
  if(il>.1)player.walk+=dt*sp*2.6;
  const near=Math.hypot(mon.x-player.x,mon.y-player.y);
  const on=!G.lightOff&&!G.cranking&&G.bat>0;
  if(on)G.bat=Math.max(0,G.bat-(1.6+G.found.length*.25)*dt);
  G.flickOff-=dt;
  const flickRate=near<6?(1.2+G.found.length*.35)*(1-near/6):0;
  if(on&&Math.random()<flickRate*dt)G.flickOff=.06+Math.random()*(.12+G.found.length*.03);
  if(on&&G.bat<15&&Math.random()<dt*3)G.flickOff=.05+Math.random()*.2;
  G.flashOn=on&&G.flickOff<=0;
  if(G.bat<20&&!G.once.lowbat){G.once.lowbat=1;caption(LINES.dark)}if(G.bat>40)G.once.lowbat=0;
  let prompt='';
  PHOTOS.forEach((p,i)=>{if(G.found.includes(i))return;if(Math.hypot(p.x-player.x,p.y-player.y)<1.1){prompt='<kbd>E</kbd>Pick up the photograph';if(ePress){ePress=false;G.found.push(i);photoMeshes[i].visible=false;onPhoto(i)}}});
  if(G.finalSpawned&&!G.finalTaken&&Math.hypot(17-player.x,22.6-player.y)<1.1){prompt='<kbd>E</kbd>Pick up the photograph';if(ePress){ePress=false;G.finalTaken=true;finalMesh.visible=false;openPhoto(6);
    setTimeout(()=>{caption(LINES.unlock);S.sting();G.shake=.6;mon.x=17;mon.y=16.8;mon.field=null;mon.unseen=0;setTimeout(()=>caption(LINES.awake),1500)},300)}}
  if(G.finalTaken&&Math.hypot(DOOR.x-player.x,DOOR.y-player.y)<1.3){prompt='<kbd>E</kbd>Open the door';if(ePress){showEnding();return}}
  ePress=false;
  const pr=$('prompt');if(prompt){if(pr.innerHTML!==prompt)pr.innerHTML=prompt;pr.hidden=false}else pr.hidden=true;
  $('crank').hidden=!G.cranking;
  updateMonster(dt);
  if(G.state!=='play')return;
  lightning(dt);
  for(const c of G.caps)c.life-=dt;if(G.caps.length&&G.caps[0].life<=0){G.caps.shift();renderCaptions()}
  updateHUD();
  setLoop('tension',clamp(1-near/8,0,1)*.05);
  if(Math.random()<dt*.08){const r=ROOMS[Math.floor(Math.random()*ROOMS.length)];S.creak(pan(r.x+r.w/2,r.y+r.h/2),.6)}
}
function onPhoto(i){
  openPhoto(i);S.sting();
  if(G.found.length===6&&!G.finalSpawned){G.finalSpawned=true;finalMesh.visible=true;setTimeout(()=>caption('[Something was left for you by the front door.]'),400)}
  else setTimeout(()=>caption(['[Somewhere, small feet run across the floor.]','[It giggles. It sounds pleased.]','[The house is very quiet now.]','[You hear it humming a lullaby.]','[It knows which room you are in.]'][Math.min(4,G.found.length-1)]),400);
  if(G.found.length>=3)setTimeout(()=>{if(G.state==='play'&&!G.paused&&!mon.seen)relocateBehind()},6000+Math.random()*6000);
}
function updateMonster(dt){
  const d=Math.hypot(mon.x-player.x,mon.y-player.y);
  const seen=lit(mon.x,mon.y)||(G.lightning>.4&&inView(mon.x,mon.y));
  mon.seen=seen;
  if(seen&&!mon.frozenOnce&&d<9){mon.frozenOnce=true;caption(LINES.firstSee);S.sting()}
  let sp=speedFor();
  const canMove=!seen||G.finalTaken;
  if(G.finalTaken&&seen)sp*=.35;
  mon.moving=false;
  if(canMove){
    mon.unseen+=dt;
    mon.fieldT-=dt;if(mon.fieldT<=0||!mon.field){mon.field=bfs(Math.floor(player.x),Math.floor(player.y));mon.fieldT=.3}
    const burst=1+Math.min(1,mon.unseen/4)*.5;
    mon.moving=moveAlong(mon,mon.field,player.x,player.y,sp*burst,dt);
    if(mon.moving){mon.stepT-=dt;if(mon.stepT<=0){mon.stepT=.11+Math.random()*.08;const v=fall(mon.x,mon.y,18);if(v>.01)S.skitter(pan(mon.x,mon.y),v*.9)}}
    mon.gigT-=dt;if(mon.gigT<=0){mon.gigT=7+Math.random()*9;const v=fall(mon.x,mon.y,24);if(v>.02)S.giggle(pan(mon.x,mon.y),v*.8)}
    const relocAfter=Math.max(9,20-G.found.length*2);
    if(!G.finalTaken&&mon.unseen>relocAfter&&d>8&&!inView(mon.x,mon.y)&&Math.random()<dt*.5)relocateBehind();
  }else{mon.unseen=0;if(d<3){mon.closeT+=dt;if(mon.closeT>1.2&&!G.once.close){G.once.close=1;caption(LINES.close)}}else mon.closeT=0}
  if(d<7){G.heartT=(G.heartT||0)-dt;if(G.heartT<=0){G.heartT=Math.max(.32,d*.13);S.heart(.3*(1-d/7)+.06)}}
  if(d<.6)die();
}
function die(){if(G.state!=='play')return;G.state='dying';G.scareT=0;$('hud').hidden=true;$('album').hidden=true;S.scare();unlock()}
function lightning(dt){
  G.nextLightning-=dt;
  if(G.nextLightning<=0){G.nextLightning=14+Math.random()*26;G.lightning=1;G.thunderAt=.4+Math.random()*1.6;G.lStrike=0}
  if(G.lightning>0){G.lStrike+=dt;const t=G.lStrike;G.lightning=t<.08?1:t<.16?.15:t<.24?.9:Math.max(0,.9-(t-.24)*4)}
  if(G.thunderAt>0){G.thunderAt-=dt;if(G.thunderAt<=0)S.thunder(.5+Math.random()*.4)}
}
function updateHUD(){
  const b=$('batBar');b.style.width=G.bat.toFixed(0)+'%';b.classList.toggle('low',G.bat<20);
  $('stBar').style.width=G.stam.toFixed(0)+'%';
  const c=G.finalTaken?'Get out':`${G.found.length} / 6`;if($('photoCount').textContent!==c)$('photoCount').textContent=c;
  const ri=roomAt(player.x,player.y);const rn=ri>=0?ROOMS[ri].name:'Doorway';if($('roomName').textContent!==rn)$('roomName').textContent=rn;
  $('lookHint').hidden=!(lastPtr==='mouse'&&!locked&&!G.paused);
}

/* ================= RENDER ================= */
const grainCv=document.createElement('canvas');grainCv.width=grainCv.height=160;
(function(){const g=grainCv.getContext('2d'),id=g.createImageData(160,160);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0)})();
let grainPat=null;
function sync(dt){
  const tm=G.time,L=G.lightning;
  hemi.intensity=.015+L*1.6;windows.forEach(m=>m.emissiveIntensity=.03+L*3);
  const playing=G.state==='play';
  rockers.forEach((r,i)=>{if(!playing||!lit(r.position.x/TS,r.position.z/TS,.5))r.rotation.z=Math.sin(tm*(1.6+i*.3))*.12});
  photoMeshes.forEach((m,i)=>{if(m.visible)m.userData.mat.emissiveIntensity=playing&&lit(PHOTOS[i].x,PHOTOS[i].y,0)?.18+.1*Math.sin(tm*5):0});
  if(finalMesh&&finalMesh.visible)finalMesh.userData.mat.emissiveIntensity=.2+.15*Math.sin(tm*4);
  if(doorPivot)doorPivot.rotation.y=G.finalTaken?(G.state==='end'?1.3:.08+Math.sin(tm*2)*.03):0;
  if(monster&&G.state!=='dying'){
    monster.visible=playing||G.state==='dead';
    monster.position.set(wx(mon.x),0,wz(mon.y));
    const toP=Math.atan2(player.y-mon.y,player.x-mon.x);
    if(!mon.moving)mon.face+=angDiff(mon.face,toP)*(mon.seen?0:Math.min(1,dt*6));
    monster.rotation.y=Math.atan2(Math.cos(mon.face),Math.sin(mon.face));
    monster.scale.setScalar(1);
    const d=Math.hypot(mon.x-player.x,mon.y-player.y);
    eyes.userData.mat.opacity=(!mon.seen&&d<11&&monster.visible&&los(player.x,player.y,mon.x,mon.y))?(.35+.35*Math.sin(tm*1.3))*(1-d/11)+.1:0;
    if(mixer)mixer.timeScale=mon.seen&&!G.finalTaken?0:(mon.moving?2.2:.5);
  }
  if(mixer)mixer.update(dt);
}
function placeCamera(dt){
  if(G.state==='title'||G.state==='loading'){G.camDrift+=dt*.03;camera.position.set(wx(17+Math.sin(G.camDrift)*12),EYE,wz(17));camera.rotation.set(-.06,Math.PI/2+Math.sin(G.camDrift*1.4)*1.1,0);flash.visible=true;flash.intensity=8+Math.random()*2;spill.visible=false;return}
  flash.intensity=34*(G.bat<15?.55+G.bat/35:1);flash.visible=G.flashOn&&G.state!=='dead';spill.visible=flash.visible;
  const bob=Math.sin(player.walk*2)*.03;G.shake=Math.max(0,G.shake-dt);const sh=G.shake*.05;
  camera.position.set(wx(player.x)+(Math.random()-.5)*sh,EYE+bob+(Math.random()-.5)*sh,wz(player.y)+(Math.random()-.5)*sh);
  camera.rotation.set(player.pitch,player.yaw,0);
}
function scareStep(){
  if(!monster)return;
  const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);fwd.y=0;if(fwd.lengthSq()<1e-6)fwd.set(0,0,-1);fwd.normalize();
  const t=G.scareT,d=Math.max(.32,1.3-t*2.2);
  monster.visible=true;monster.scale.setScalar(1.15);
  monster.position.set(camera.position.x+fwd.x*d,EYE-mHeight*1.05+Math.sin(Math.min(1,t*3)*Math.PI)*.25,camera.position.z+fwd.z*d);
  monster.rotation.y=Math.atan2(-fwd.x,-fwd.z);if(mixer)mixer.timeScale=3;eyes.userData.mat.opacity=1;
  flash.visible=Math.random()<.6;flash.intensity=40;G.shake=1;
}
function renderFX(dt){
  const w=fxCv.width,h=fxCv.height;fx.clearRect(0,0,w,h);
  fx.fillStyle=vign;fx.fillRect(0,0,w,h);
  const d=Math.hypot(mon.x-player.x,mon.y-player.y);const danger=G.state==='play'?clamp(1-d/6,0,1):G.state==='dying'?1:0;
  if(!grainPat)grainPat=fx.createPattern(grainCv,'repeat');
  fx.save();fx.globalAlpha=.09+danger*.2;fx.translate(Math.random()*160,Math.random()*160);fx.fillStyle=grainPat;fx.fillRect(-160,-160,w+320,h+320);fx.restore();
  if(danger>0){fx.fillStyle=`rgba(90,0,0,${danger*(G.state==='dying'?.35:.14)})`;fx.fillRect(0,0,w,h)}
  if(G.state==='dying'&&Math.random()<.35){fx.fillStyle='rgba(0,0,0,.85)';fx.fillRect(0,0,w,h)}
  if(G.state==='play'&&G.stam<25){fx.fillStyle=`rgba(0,0,0,${(25-G.stam)/25*.35})`;fx.fillRect(0,0,w,h)}
}

/* ================= LOOP ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;G.time+=dt;
  try{
    if(G.state==='play'&&!G.paused)update(dt);
    placeCamera(dt);
    sync(dt);
    if(G.state==='dying'){G.scareT+=dt;scareStep();if(G.scareT>1.3)showDeath()}
    renderer.render(scene,camera);renderFX(dt);
  }catch(err){console.error(err)}
  requestAnimationFrame(loop);
}
buildHouse();placePhotos();G.state='title';showTitle();requestAnimationFrame(loop);
loadMonster(()=>{modelReady=true;const b=$('goTitle');if(b){b.disabled=false;b.textContent='Go inside';b.focus({preventScroll:true})}});
</script>
